  <!-- Weathervane finial -->
  <line x1="32" y1="6" x2="32" y2="1" stroke="#C08A2E" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="3.2" r="1.8" fill="#C08A2E"/>
</svg>
