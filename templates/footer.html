<footer class="site">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <p class="foot-heading">{{ORG_NAME}}</p>
        <p>{{VENUE}}, {{STREET}}<br>{{TOWN}}, {{COUNTY}} {{POSTCODE}}</p>
        <p class="foot-note">Church of England &middot; Diocese of Rochester</p>
      </div>
      <div>
        <p class="foot-heading">Explore</p>
        <p>{{FOOTER_NAV_ITEMS}}</p>
